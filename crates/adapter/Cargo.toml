[package]
name = "myproxy-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
myproxy-ir = { path = "../ir" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
uuid = { version = "1", features = ["v4"] }